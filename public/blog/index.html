			document.documentElement.classList.toggle('dark', dark)
			var l = document.getElementById('syntax-light')
			var d = document.getElementById('syntax-dark')
			if (l && d) { l.disabled = dark; d.disabled = !dark }

	<script>
		// Floating header gains its border + background once you leave the top
		const header = document.getElementById('siteHeader')
		const onScroll = () => header.classList.toggle('not-top', window.scrollY > 0)
		onScroll()
		window.addEventListener('scroll', onScroll, { passive: true })

		// Mobile nav
		document.getElementById('toggleMenu').addEventListener('click', () => {
			header.classList.toggle('expanded')
		})

		// Theme cycles system -> light -> dark
		const darkBtn = document.getElementById('toggleDarkMode')
		const syntaxLight = document.getElementById('syntax-light')
		const syntaxDark = document.getElementById('syntax-dark')
		const order = ['system', 'light', 'dark']
		const media = window.matchMedia('(prefers-color-scheme: dark)')

		const apply = (theme) => {
			const dark = theme === 'dark' || (theme === 'system' && media.matches)
			document.documentElement.classList.toggle('dark', dark)
			syntaxLight.disabled = dark
			syntaxDark.disabled = !dark
			darkBtn.dataset.theme = theme
		}

		apply(localStorage.getItem('theme') || 'system')

		darkBtn.addEventListener('click', () => {
			const next = order[(order.indexOf(darkBtn.dataset.theme) + 1) % order.length]
			localStorage.setItem('theme', next)
			apply(next)
		})

		media.addEventListener('change', () => {
			if (darkBtn.dataset.theme === 'system') apply('system')
		})
	</script>
